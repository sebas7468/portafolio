<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Sebas7468</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>

    <div id="entry-screen">

        <button id="enter-btn">Ingresar</button>
    </div>

    <div id="main-content" class="hidden">
        <div id="portfolio-homepage">

            <h2>Bienvenid@ mi portafolio! ;)</h2>
            <p class="description">Puedes darte una vuelta por mi sitio web y ver mis proyectos </p>


            <div class="category-container" id="category-list">
                <!-- Dynamic Content -->
            </div>

            <div id="sidebar-contact">
                <!-- Dynamic Contact -->
            </div>

        </div>

        <div class="windows-container" id="active-window">
            <div class="window-header" id="window-title-bar">
                <!-- Dynamic Title -->
            </div>
            <div class="window-body" id="window-content-area">
                <!-- Dynamic Body -->
            </div>
        </div>
    </div>

    <div id="footer-counter" class="hidden" style="text-align: center; color: #888; font-size: 11px; padding: 15px 0; background: transparent; width: 100%; position: relative; bottom: 0;">
        total de visitas hoy: <span id="visit-count">...</span>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
